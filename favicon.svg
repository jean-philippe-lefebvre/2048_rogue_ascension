    <linearGradient id="bl" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#5b8cff" stop-opacity=".95"/><stop offset=".5" stop-color="#5b8cff" stop-opacity=".6"/><stop offset="1" stop-color="#5b8cff" stop-opacity=".3"/></linearGradient>
