server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Block dotfiles (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny  all;
        return 404;
    }

    # Block sensitive project files
    location ~* ^/(CLAUDE\.md|README\.md|docker-compose\.yml|Dockerfile|Makefile|LICENSE)$ {
        deny  all;
        return 404;
    }

    # Web app manifest: nginx's default mime table does not know .webmanifest
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Only serve the game assets. Files are unversioned, so browsers must revalidate
    # (ETag, 304 when unchanged) to pick up a deploy instead of guessing a cache lifetime.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
