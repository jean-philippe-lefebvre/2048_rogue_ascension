server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Block dotfiles (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny  all;
        return 404;
    }

    # Block sensitive project files
    location ~* ^/(CLAUDE\.md|README\.md|docker-compose\.yml|Dockerfile|Makefile|LICENSE)$ {
        deny  all;
        return 404;
    }

    # Only serve the game assets
    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
