services:
  2048-rogue-ascension:
    image: nginx:alpine
    container_name: 2048-rogue-ascension
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.2048-rogue-ascension.rule=Host(`2048.54.39.99.188.sslip.io`)"
      - "traefik.http.routers.2048-rogue-ascension.entrypoints=websecure"
      - "traefik.http.routers.2048-rogue-ascension.tls.certresolver=letsencrypt"
      - "traefik.http.services.2048-rogue-ascension.loadbalancer.server.port=80"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
